name: Pnpm-Audit
on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Single root pnpm-lock.yaml covers all workspaces (api, app, e2e)
      - name: Run audit
        run: npx --yes audit-ci@^7 --moderate --package-manager pnpm
